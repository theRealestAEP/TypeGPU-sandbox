<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Liquid in a Cup</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #06080a;
        --panel: rgba(13, 18, 22, 0.66);
        --panel-solid: #0d1216;
        --line: rgba(255, 255, 255, 0.11);
        --line-strong: rgba(255, 255, 255, 0.22);
        --ink: #e9eff3;
        --muted: #78878f;
        --accent: #56c8f5;
        --accent-soft: rgba(86, 200, 245, 0.16);
        --danger: #ff8a7a;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 400 14px/1.5 system-ui, -apple-system, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- stage ---------- */
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas {
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      /* Keeps the HUD legible over a bright scene without dimming the middle. */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(to bottom, rgba(0,0,0,.55), transparent 18%, transparent 72%, rgba(0,0,0,.65)),
          radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.5));
      }
      video { display: none; }

      /* Spout marker: position is where you pour, size is how near to the camera. */
      #spout {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: .5;
        transition: opacity .15s;
      }
      #spout::before,
      #spout::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid var(--accent);
      }
      #spout::before { width: var(--ring); height: var(--ring); opacity: .55; }
      #spout::after { width: 5px; height: 5px; background: var(--accent); border: 0; }
      #spout[data-live="true"] { opacity: 1; }

      /* ---------- hud shell ---------- */
      .hud { position: fixed; z-index: 2; }
      .hud-tl { top: clamp(.9rem, 2.2vh, 1.6rem); left: clamp(.9rem, 2.2vw, 1.6rem); }
      .hud-l {
        top: 50%;
        left: clamp(.9rem, 2.2vw, 1.6rem);
        transform: translateY(-50%);
        width: 11.5rem;
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: .5rem;
        padding: .7rem;
        background: var(--panel);
        backdrop-filter: blur(14px) saturate(1.3);
        -webkit-backdrop-filter: blur(14px) saturate(1.3);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 10px 34px -18px #000;
      }
      .panel > h2 {
        margin: 0 0 .1rem;
        font-family: var(--mono);
        font-size: .62rem;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .scenario {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: .12rem;
        width: 100%;
        text-align: left;
        text-transform: none;
        letter-spacing: 0;
        font-family: inherit;
        font-size: .8rem;
        color: var(--ink);
        padding: .45rem .55rem;
      }
      .scenario small {
        font-family: var(--mono);
        font-size: .6rem;
        letter-spacing: .04em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .scenario[aria-pressed="true"] small { color: var(--accent); }
      .hud-tr { top: clamp(.9rem, 2.2vh, 1.6rem); right: clamp(.9rem, 2.2vw, 1.6rem); }
      .hud-b {
        bottom: clamp(.9rem, 2.2vh, 1.6rem);
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100vw - 1.8rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(1rem, 2.4vh, 1.15rem);
        font-weight: 700;
        letter-spacing: .26em;
        text-transform: uppercase;
      }
      h1 span { color: var(--accent); }
      #status {
        margin: .45rem 0 0;
        font-family: var(--mono);
        font-size: .72rem;
        letter-spacing: .02em;
        color: var(--muted);
        max-width: 22rem;
        text-wrap: pretty;
      }
      #status[data-tone="error"] { color: var(--danger); }

      /* ---------- controls ---------- */
      .cluster {
        display: flex;
        align-items: center;
        gap: .28rem;
        padding: .34rem;
        background: var(--panel);
        backdrop-filter: blur(14px) saturate(1.3);
        -webkit-backdrop-filter: blur(14px) saturate(1.3);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 10px 34px -18px #000;
      }
      .hud-b .cluster { flex-wrap: wrap; justify-content: center; }

      button {
        appearance: none;
        font: inherit;
        font-family: var(--mono);
        font-size: .74rem;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: .4rem .5rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: .42rem;
        white-space: nowrap;
        transition: color .12s, background .12s, border-color .12s;
      }
      button:hover { color: var(--ink); background: rgba(255,255,255,.05); }
      button[aria-pressed="true"], button.on {
        color: var(--accent);
        background: var(--accent-soft);
        border-color: rgba(86,200,245,.32);
      }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      kbd {
        font-family: var(--mono);
        font-size: .6rem;
        line-height: 1;
        padding: .2rem .3rem;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--muted);
        background: rgba(255,255,255,.04);
      }
      button[aria-pressed="true"] kbd { border-color: rgba(86,200,245,.3); }

      .rule { width: 1px; align-self: stretch; background: var(--line); margin: 0 .18rem; }

      /* ---------- fill meter ---------- */
      .meter {
        display: flex;
        align-items: center;
        gap: .4rem;
        padding: 0 .35rem 0 .25rem;
        font-family: var(--mono);
        font-size: .68rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .meter-track {
        width: clamp(2.8rem, 7vw, 5rem);
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,.1);
        overflow: hidden;
      }
      .meter-fill {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width .25s ease-out;
      }
      .meter b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 2.6em; }

      /* ---------- tuning drawer ---------- */
      #tune {
        position: fixed;
        z-index: 3;
        top: 0;
        right: 0;
        height: 100%;
        width: min(20rem, 88vw);
        padding: 1.1rem 1.1rem 5rem;
        background: var(--panel-solid);
        border-left: 1px solid var(--line);
        overflow-y: auto;
        transform: translateX(100%);
        transition: transform .22s cubic-bezier(.4, 0, .2, 1);
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      #tune[data-open="true"] { transform: none; }
      #tune header { display: flex; align-items: baseline; justify-content: space-between; }
      #tune h2 {
        margin: 0;
        font-size: .7rem;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }

      .group { display: flex; flex-direction: column; gap: .65rem; }
      .group > h3 {
        margin: 0;
        font-family: var(--mono);
        font-size: .62rem;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: .75;
        padding-bottom: .35rem;
        border-bottom: 1px solid var(--line);
      }
      .field { display: flex; flex-direction: column; gap: .3rem; }
      .field-label {
        display: flex; justify-content: space-between; gap: .6rem;
        font-family: var(--mono); font-size: .68rem; color: var(--muted);
      }
      .field-label b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
      input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; height: 1.1rem; }
      select {
        width: 100%; font: inherit; font-size: .78rem;
        background: #151b20; color: var(--ink);
        border: 1px solid var(--line); border-radius: 6px; padding: .38rem .5rem;
      }

      /* ---------- hint ---------- */
      #hint {
        position: fixed;
        z-index: 2;
        left: 50%;
        bottom: clamp(4.6rem, 11vh, 6.2rem);
        transform: translateX(-50%);
        margin: 0;
        font-family: var(--mono);
        font-size: .7rem;
        letter-spacing: .08em;
        color: var(--muted);
        background: var(--panel);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: .34rem .8rem;
        pointer-events: none;
        opacity: 1;
        transition: opacity .5s;
        white-space: nowrap;
      }
      #hint[data-hidden="true"] { opacity: 0; }

      /* Drop target feedback */
      #stage[data-drop="true"]::after {
        content: "Drop an image or video to use it as the scene";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: .8rem;
        letter-spacing: .08em;
        color: var(--accent);
        background: rgba(6, 8, 10, .72);
        border: 2px dashed var(--accent);
        z-index: 4;
      }

      @media (max-width: 40rem) {
        h1 { font-size: .82rem; letter-spacing: .2em; }
        #status { font-size: .64rem; max-width: 14rem; }
        button { padding: .38rem .48rem; font-size: .66rem; }
        button kbd { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="stage"><canvas></canvas><div id="spout" aria-hidden="true"></div></div>
    <div id="vignette"></div>
    <video playsinline muted></video>
    <input id="picker" type="file" accept="image/*,video/*" hidden />

    <header class="hud hud-tl">
      <h1>Liquid<span>.</span></h1>
      <p id="status">Starting…</p>
    </header>

    <nav class="hud hud-tr"><div class="cluster" id="views"></div></nav>

    <aside class="hud hud-l">
      <div class="panel">
        <h2>Scenarios</h2>
        <div id="scenarios"></div>
      </div>
    </aside>

    <div class="hud hud-b">
      <div class="cluster">
        <div class="cluster" id="scenes" style="padding:0;border:0;background:none;backdrop-filter:none;box-shadow:none"></div>
        <button id="open">Open <kbd>O</kbd></button>
        <div class="rule"></div>
        <button id="pour" aria-pressed="false">Hold <kbd>space</kbd></button>
        <button id="storm" aria-pressed="false">Storm <kbd>S</kbd></button>
        <div class="cluster" id="media" style="padding:0;border:0;background:none;backdrop-filter:none;box-shadow:none"></div>
        <button id="drain">Drain <kbd>D</kbd></button>
        <button id="reset">Refill <kbd>R</kbd></button>
        <div class="rule"></div>
        <div class="meter">
          Fill <span class="meter-track"><span class="meter-fill" id="meter"></span></span>
          <b id="meterValue">0%</b>
        </div>
        <div class="rule"></div>
        <button id="tuneToggle">Tune <kbd>T</kbd></button>
      </div>
    </div>

    <p id="hint">Hold to pour &middot; scroll for depth &middot; drop an image or video</p>

    <aside id="tune" data-open="false">
      <header><h2>Tuning</h2><button id="tuneClose">Close</button></header>
      <div id="tuneBody"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
