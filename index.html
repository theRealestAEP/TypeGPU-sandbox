<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TypeGPU Sandbox</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>💧</text></svg>" />
    <style>
      /*
        The picture is the product; the controls are the console around it.
        Everything here follows from that. The simulation is square, the window
        rarely is, so the leftover width becomes the console and the image is
        never covered. Readouts sit on the image the way a viewfinder's do -
        no panel, no chrome - and only things you press get a surface.
      */
      :root {
        color-scheme: dark;
        --ground: #07090b;
        --console: #0b0e11;
        --scrim: rgba(9, 12, 15, 0.84);
        --edge: rgba(255, 255, 255, 0.09);
        --edge-lit: rgba(255, 255, 255, 0.2);
        --text: #f3f1ed;
        --text-dim: rgba(246, 244, 240, .66);
        --text-faint: rgba(246, 244, 240, .4);
        /* Amber, because the water is blue. An instrument's readouts should
           never be the same colour as the thing it is measuring. */
        --signal: #f2a65a;
        --signal-dim: rgba(242, 166, 90, 0.14);
        --alert: #e2685b;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
        --rail: 15.5rem;
        --gap: 1.1rem;
        --plate: min(100vh, 100vw);
      }
      * { box-sizing: border-box; }
      /* The hidden attribute must always win. The tool filter sets it on
         drawer groups whose own display:flex was quietly overriding the UA's
         [hidden] rule - so every tool showed every setting. */
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--text);
        font: 400 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- the plate ---------- */
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        transition: transform .28s cubic-bezier(.4, 0, .2, 1);
      }
      canvas {
        width: var(--plate);
        height: var(--plate);
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      /* Frame marks. The plate's edge is otherwise invisible against the
         letterbox, and knowing where the simulation stops is real information. */
      #stage::before,
      #stage::after {
        content: "";
        position: absolute;
        width: var(--plate);
        height: var(--plate);
        pointer-events: none;
        --arm: 14px;
        --thin: 1px;
      }
      #stage::before {
        background:
          linear-gradient(var(--edge-lit), var(--edge-lit)) 0 0 / var(--arm) var(--thin),
          linear-gradient(var(--edge-lit), var(--edge-lit)) 0 0 / var(--thin) var(--arm),
          linear-gradient(var(--edge-lit), var(--edge-lit)) 100% 0 / var(--arm) var(--thin),
          linear-gradient(var(--edge-lit), var(--edge-lit)) 100% 0 / var(--thin) var(--arm);
        background-repeat: no-repeat;
      }
      #stage::after {
        background:
          linear-gradient(var(--edge-lit), var(--edge-lit)) 0 100% / var(--arm) var(--thin),
          linear-gradient(var(--edge-lit), var(--edge-lit)) 0 100% / var(--thin) var(--arm),
          linear-gradient(var(--edge-lit), var(--edge-lit)) 100% 100% / var(--arm) var(--thin),
          linear-gradient(var(--edge-lit), var(--edge-lit)) 100% 100% / var(--thin) var(--arm);
        background-repeat: no-repeat;
      }
      /* Only the top and bottom edges, and only enough to float text off a
         bright scene. The old version darkened the corners too and made every
         photo look like it had been shot through a keyhole. */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.5),
          transparent 14%,
          transparent 78%,
          rgba(0, 0, 0, 0.55)
        );
      }
      video { display: none; }

      /* Spout marker: where you pour, sized by how near the camera it is. */
      #spout {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: .45;
        transition: opacity .15s;
      }
      #spout::before,
      #spout::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
      }
      #spout::before {
        width: var(--ring);
        height: var(--ring);
        border: 1px solid var(--signal);
        opacity: .5;
      }
      #spout::after { width: 4px; height: 4px; background: var(--signal); }
      #spout[data-live="true"] { opacity: 1; }

      /* ---------- readouts: on the image, never in a box ---------- */
      .readout {
        position: fixed;
        z-index: 2;
        isolation: isolate;
        text-shadow: 0 1px 12px rgba(0, 0, 0, .9), 0 0 2px rgba(0, 0, 0, .8);
      }
      .readout::before {
        content: "";
        position: absolute;
        /* Generous box, so the falloff reaches nothing before the box does.
           A gradient that is still visible at its own edge draws a rectangle,
           which is exactly the panel this was meant to avoid. */
        inset: -1.6rem -22rem -12rem -1.6rem;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(
          ellipse 118% 118% at 0% 0%,
          rgba(4, 6, 8, .9) 0%,
          rgba(4, 6, 8, .62) 34%,
          rgba(4, 6, 8, .22) 56%,
          transparent 74%
        );
      }
      .rd-tl { top: var(--gap); left: var(--gap); }

      h1 {
        margin: 0;
        font-size: .95rem;
        font-weight: 600;
        letter-spacing: .3em;
        text-transform: uppercase;
      }
      /* Tally lamp. The wordmark's period is the only thing on screen that
         reports whether liquid is actually leaving the spout. */
      h1 span { color: var(--text-faint); transition: color .12s, text-shadow .12s; }
      body[data-pouring="true"] h1 span {
        color: var(--signal);
        text-shadow: 0 0 10px var(--signal);
      }
      #status {
        margin: .5rem 0 0;
        font-size: .74rem;
        line-height: 1.5;
        color: var(--text-dim);
        max-width: 14.5rem;
        text-wrap: pretty;
      }
      #status[data-tone="error"] { color: var(--alert); }

      /* Fingertip control: an input method, not a tool, so it lives with the
         readouts rather than in the tool bar. Only where there is video. */
      #handToggle,
      #faceFilters {
        margin-top: .75rem;
        border: 1px solid var(--edge);
      }
      #faceFilters { margin-left: .35rem; }
      #handToggle[aria-pressed="true"] {
        color: var(--signal);
        background: var(--signal-dim);
      }

      /* ---------- console rails ---------- */
      .rail {
        position: fixed;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: .9rem;
      }
      .rail-l { left: var(--gap); bottom: var(--gap); width: calc(var(--rail) - var(--gap)); }
      .rail-r { right: var(--gap); top: var(--gap); align-items: flex-end; }

      .eyebrow {
        margin: 0 0 .55rem;
        font-family: var(--mono);
        font-size: .58rem;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--text-faint);
        font-weight: 400;
      }

      /* Solid. Costs the compositor nothing. */
      .surface {
        background: var(--console);
        border: 1px solid var(--edge);
        border-radius: 3px;
        box-shadow: inset 0 1px 0 var(--edge-lit), 0 18px 44px -22px rgba(0, 0, 0, .9);
      }
      /* The one glass surface, because the bar genuinely sits over the picture.
         brightness() is what makes it work on arbitrary imagery: it scales
         whatever is behind it, so white tile is pulled down proportionally
         while a dark scene stays dark instead of turning to mud. */
      .glass {
        background: rgba(6, 9, 11, .55);
        backdrop-filter: blur(24px) saturate(.6) brightness(.34);
        -webkit-backdrop-filter: blur(24px) saturate(.6) brightness(.34);
        border: 1px solid var(--edge);
        border-radius: 3px;
        box-shadow: inset 0 1px 0 var(--edge-lit), 0 24px 60px -24px rgba(0, 0, 0, .85);
      }
      @supports not (backdrop-filter: blur(1px)) {
        .glass { background: rgba(9, 12, 15, .9); }
      }

      /* ---------- scenarios ---------- */
      #scenarios { display: flex; flex-direction: column; }
      .scenario {
        display: block;
        width: 100%;
        text-align: left;
        padding: .5rem .6rem;
        border: 0;
        border-left: 2px solid transparent;
        border-radius: 0;
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        cursor: pointer;
        transition: color .12s, background .12s, border-color .12s;
      }
      .scenario + .scenario { border-top: 1px solid rgba(255, 255, 255, .05); }
      .scenario:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
      .scenario small {
        display: block;
        margin-top: .1rem;
        font-size: .66rem;
        line-height: 1.35;
        color: var(--text-faint);
      }
      .scenario[aria-pressed="true"] {
        color: var(--text);
        border-left-color: var(--signal);
        background: rgba(255, 255, 255, .05);
      }
      .scenario[aria-pressed="true"] small { color: var(--signal); }

      /* Source lives with the scenarios: choosing where the picture comes from
         is picking a subject, not firing an action. */
      .sources { flex-wrap: wrap; gap: .1rem; padding: 0 .35rem .1rem; }
      button.wide {
        width: calc(100% - .7rem);
        margin: .1rem .35rem .45rem;
        justify-content: space-between;
        border: 1px solid var(--edge);
      }

      /* ---------- controls ---------- */
      .cluster {
        display: flex;
        align-items: center;
        gap: .15rem;
        padding: .25rem;
      }
      /* Three groups, spaced not ruled: source, pour, scene. */
      #pour, #drain { margin-left: .7rem; }
      .bar {
        position: fixed;
        z-index: 2;
        bottom: var(--gap);
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100vw - 2 * var(--gap));
        display: flex;
        align-items: center;
        gap: .15rem;
        padding: .25rem;
        /* Never wraps. A control bar that reflows into ragged rows reads as an
           accident; one that scrolls reads as a console too small for the desk. */
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .bar::-webkit-scrollbar { display: none; }

      button {
        appearance: none;
        font: inherit;
        font-size: .74rem;
        color: var(--text-dim);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 3px;
        padding: .38rem .55rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        white-space: nowrap;
        transition: color .12s, background .12s, border-color .12s;
      }
      button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
      button[aria-pressed="true"], button.on {
        color: var(--signal);
        background: var(--signal-dim);
      }
      button:focus-visible { outline: 1px solid var(--signal); outline-offset: 2px; }

      /* The one thing you hold down is the one thing that is filled in. */
      #pour { color: var(--text); border-color: var(--edge-lit); }
      #pour[aria-pressed="true"] {
        color: var(--ground);
        background: var(--signal);
        border-color: var(--signal);
      }
      /* Emptying the scene is not the same kind of act as changing a view. */
      #drain:hover { color: var(--alert); background: rgba(226, 104, 91, .1); }

      kbd {
        font-family: var(--mono);
        font-size: .58rem;
        line-height: 1;
        padding: .18rem .28rem;
        border-radius: 2px;
        color: var(--text-faint);
        background: rgba(255, 255, 255, .06);
      }
      #pour[aria-pressed="true"] kbd { color: rgba(7, 9, 11, .7); background: rgba(7, 9, 11, .14); }

      /* Which object the Objects tool plants. Only there when it matters. */
      #propKind {
        display: none;
        font: inherit;
        font-size: .72rem;
        color: var(--signal);
        background: var(--signal-dim);
        border: 0;
        border-radius: 3px;
        padding: .34rem .4rem;
        cursor: pointer;
      }
      body[data-tool="props"] #propKind { display: inline-block; }

      /* ---------- fill: a level gauge against the plate ----------
         How full the scene is, is a level. Drawn as one - a column standing
         beside the picture at the height the liquid has reached - it says the
         quantity and its own units at once, which a horizontal bar tucked in a
         toolbar never did. It is also the only element here that could not
         belong to some other program. */
      .gauge {
        position: fixed;
        z-index: 2;
        top: 50%;
        left: calc(50% - var(--plate) / 2 + 1.1rem);
        height: calc(var(--plate) - 4rem);
        transform: translateY(-50%);
        width: 3px;
        pointer-events: none;
        text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
      }
      .meter-track {
        position: absolute;
        inset: 0;
        width: 3px;
        /* Ticks every ten per cent, brighter at the quarters. */
        background:
          repeating-linear-gradient(
            to top,
            var(--edge-lit) 0 1px,
            transparent 1px 10%
          ),
          rgba(255, 255, 255, .1);
      }
      .meter-fill {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: var(--fill, 0%);
        background: var(--signal);
        box-shadow: 0 0 14px -2px var(--signal);
        transition: height .3s ease-out;
      }
      /* The reading rides at the level rather than sitting in a corner. */
      .gauge b {
        position: absolute;
        left: .65rem;
        bottom: var(--fill, 0%);
        transform: translateY(50%);
        font-family: var(--mono);
        font-size: .68rem;
        font-weight: 400;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        min-width: 4ch;
        text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
        transition: bottom .3s ease-out;
      }
      /* Above the column, not below it - the bar owns the bottom edge. */
      .gauge span.label {
        position: absolute;
        top: -1.35rem;
        left: -.15rem;
        font-family: var(--mono);
        font-size: .55rem;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      /* ---------- gravity probe ----------
         Which way the scene thinks down is, drawn on the scene. Shown while the
         tuning drawer is open, because that is when you are arguing with it. */
      .gravity {
        position: fixed;
        z-index: 2;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity .2s, transform .28s cubic-bezier(.4, 0, .2, 1);
      }
      body:has(#tune[data-open="true"]) .gravity { opacity: 1; }
      body:has(#tune[data-open="true"]) .gravity {
        transform: translateX(calc(-1 * min(9.5rem, 8vw)));
      }
      /* The point the vector is measured from. */
      .gravity::before {
        content: "";
        position: absolute;
        left: -3px;
        top: -3px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        border: 1px solid var(--signal);
      }
      .gravity-arrow {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: var(--len, 5rem);
        background: var(--signal);
        transform-origin: 0 0;
        transform: rotate(var(--roll, 0deg));
        box-shadow: 0 0 8px -1px var(--signal);
      }
      .gravity-arrow::after {
        content: "";
        position: absolute;
        left: -3px;
        bottom: -1px;
        border-left: 3.5px solid transparent;
        border-right: 3.5px solid transparent;
        border-top: 7px solid var(--signal);
      }
      /* The part of down that runs into the picture has no length on screen, so
         it is written rather than drawn. */
      .gravity-note {
        position: absolute;
        left: .7rem;
        top: .4rem;
        font-family: var(--mono);
        font-size: .62rem;
        letter-spacing: .06em;
        color: var(--signal);
        white-space: nowrap;
        text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
      }

      /* ---------- vessel probe ----------
         Everything the scene could hold liquid in, outlined with how deep it
         can fill. Shown with the drawer, like the gravity probe: both answer
         "what does the app believe about this picture". */
      .vessels {
        position: fixed;
        z-index: 2;
        top: 50%;
        left: 50%;
        width: var(--plate);
        height: var(--plate);
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity .2s, transform .28s cubic-bezier(.4, 0, .2, 1);
      }
      body:has(#tune[data-open="true"]) .vessels {
        opacity: 1;
        transform: translate(calc(-50% - min(9.5rem, 8vw)), -50%);
      }
      .vessel {
        position: absolute;
        border: 1px solid rgba(242, 166, 90, .6);
        border-radius: 2px;
      }
      .vessel span {
        position: absolute;
        left: -1px;
        top: -1.1rem;
        font-family: var(--mono);
        font-size: .56rem;
        letter-spacing: .08em;
        color: var(--signal);
        white-space: nowrap;
        text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
      }

      /* ---------- tuning ---------- */
      #tune {
        position: fixed;
        z-index: 3;
        top: 0;
        right: 0;
        height: 100%;
        width: min(19rem, 90vw);
        padding: var(--gap) var(--gap) 4rem;
        background: var(--console);
        border-left: 1px solid var(--edge);
        overflow-y: auto;
        overscroll-behavior: contain;
        transform: translateX(100%);
        transition: transform .28s cubic-bezier(.4, 0, .2, 1);
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      #tune[data-open="true"] { transform: none; }
      /* Slide the plate rather than cover it. Hiding the thing you are tuning
         behind the controls that tune it is the oldest mistake in the book.
         The console moves with it, and the scenario list stands down - while you
         are tuning you are not choosing a scene, and it is the only thing wide
         enough to end up under the picture. */
      body:has(#tune[data-open="true"]) #stage,
      body:has(#tune[data-open="true"]) .bar,
      body:has(#tune[data-open="true"]) .gauge,
      body:has(#tune[data-open="true"]) .rail-r { --shift: min(9.5rem, 8vw); }
      body:has(#tune[data-open="true"]) .gauge {
        transform: translateY(-50%) translateX(calc(-1 * var(--shift)));
      }
      body:has(#tune[data-open="true"]) #stage { transform: translateX(calc(-1 * var(--shift))); }
      body:has(#tune[data-open="true"]) .bar { transform: translateX(calc(-50% - var(--shift))); }
      body:has(#tune[data-open="true"]) .rail-r { transform: translateX(calc(-1 * min(19rem, 90vw))); }
      body:has(#tune[data-open="true"]) .rail-l {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-.75rem);
      }
      .rail-l, .rail-r, .bar, .gauge { transition: transform .28s cubic-bezier(.4, 0, .2, 1), opacity .2s; }
      #tune header { display: flex; align-items: baseline; justify-content: space-between; }
      #tune h2 {
        margin: 0;
        font-family: var(--mono);
        font-size: .62rem;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--text-faint);
        font-weight: 400;
      }
      #tuneBody { display: flex; flex-direction: column; gap: 1.4rem; }

      .group { display: flex; flex-direction: column; gap: .55rem; }
      .plumbing { display: flex; flex-direction: column; gap: 1.4rem; }
      .plumbing summary {
        cursor: pointer;
        list-style: none;
        font-family: var(--mono);
        font-size: .58rem;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--text-faint);
      }
      .plumbing summary::before { content: "+ "; }
      .plumbing[open] summary::before { content: "\2212  "; }
      .group > h3 {
        margin: 0 0 .2rem;
        font-family: var(--mono);
        font-size: .58rem;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--text-faint);
        font-weight: 400;
      }
      .field { display: flex; flex-direction: column; gap: .25rem; }
      .field-label {
        display: flex;
        justify-content: space-between;
        gap: .6rem;
        font-size: .72rem;
        color: var(--text-dim);
      }
      .field-label b {
        color: var(--text);
        font-family: var(--mono);
        font-weight: 400;
        font-size: .68rem;
        /* Values change every frame; without tabular figures the label dances. */
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] { width: 100%; accent-color: var(--signal); margin: 0; height: 1rem; }
      select {
        width: 100%;
        font: inherit;
        font-size: .74rem;
        background: #12171b;
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: .35rem .45rem;
      }

      /* ---------- hint ---------- */
      #hint {
        margin: .75rem 0 0;
        max-width: 14.5rem;
        font-size: .7rem;
        line-height: 1.5;
        color: var(--text-dim);
        pointer-events: none;
        transition: opacity .6s;
      }
      #hint[data-hidden="true"] { opacity: 0; }

      #stage[data-drop="true"]::after {
        content: "Drop an image or video to use it as the scene";
        inset: 0;
        display: grid;
        place-items: center;
        width: auto;
        height: auto;
        background: rgba(7, 9, 11, .78);
        border: 1px solid var(--signal);
        font-size: .8rem;
        color: var(--signal);
        z-index: 4;
      }

      /* Wide enough for a console beside the plate: keep the plate clear of it. */
      @media (min-width: 62.001rem) {
        :root { --plate: min(100vh, calc(100vw - var(--rail) - 4rem)); }
      }

      /* Narrow: the console has nowhere to stand, so it comes back over the
         image. Scenarios collapse to a strip rather than a column. */
      @media (max-width: 62rem) {
        .rail-l {
          left: var(--gap);
          right: var(--gap);
          bottom: calc(var(--gap) + 3.4rem);
          width: auto;
        }
        button kbd { display: none; }
        #scenarios { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
        #scenarios::-webkit-scrollbar { display: none; }
        .scenario { width: auto; white-space: nowrap; border-left: 0; border-top: 2px solid transparent; }
        .scenario + .scenario { border-top: 2px solid transparent; border-left: 1px solid rgba(255,255,255,.05); }
        .scenario[aria-pressed="true"] { border-left-color: transparent; border-top-color: var(--signal); }
        .scenario small { display: none; }
        body:has(#tune[data-open="true"]) #stage { transform: none; }
        .gauge { display: none; }
      }
      @media (max-width: 40rem) {
        h1 { font-size: .8rem; letter-spacing: .24em; }
        #status, #hint { font-size: .68rem; max-width: 12rem; }
        button { padding: .34rem .45rem; font-size: .68rem; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="stage"><canvas></canvas><div id="spout" aria-hidden="true" hidden></div></div>
    <div id="vignette"></div>
    <video playsinline muted></video>
    <input id="picker" type="file" accept="image/*,video/*" hidden />

    <header class="readout rd-tl">
      <h1>Liquid<span>.</span></h1>
      <p id="status">Starting…</p>
      <p id="hint">Hold to pour. Scroll to set the spout's depth. Drop in an image or video.</p>
      <button id="handToggle" aria-pressed="true" hidden>Hand control <kbd>H</kbd></button>
      <button id="faceFilters" hidden>Face filters&hellip;</button>
    </header>

    <div class="gauge" aria-hidden="true">
      <span class="meter-track"></span>
      <span class="meter-fill" id="meter"></span>
      <b id="meterValue">0%</b>
      <span class="label">Fill</span>
    </div>

    <div class="vessels" id="vessels" aria-hidden="true"></div>

    <div class="gravity" aria-hidden="true">
      <span class="gravity-arrow" id="gravityArrow"></span>
      <span class="gravity-note" id="gravityNote">down</span>
    </div>

    <aside class="rail rail-l">
      <div class="surface">
        <p class="eyebrow" style="padding:.55rem .6rem 0;margin-bottom:.35rem">Scenarios</p>
        <div id="scenarios"></div>
        <button id="open" class="wide">Open a file <kbd>O</kbd></button>
      </div>
    </aside>

    <nav class="rail rail-r">
      <div class="surface cluster" id="views"></div>
    </nav>

    <div class="bar glass">
      <button id="pour" aria-pressed="false">Hold <kbd>space</kbd></button>
      <button id="storm" aria-pressed="false">Storm <kbd>S</kbd></button>
      <div class="cluster" id="media" style="padding:0"></div>
      <select id="propKind" aria-label="object to place"></select>
      <button id="drain">Reset <kbd>D</kbd></button>
      <button id="tuneToggle">Tune <kbd>T</kbd></button>
    </div>

    <aside id="tune" data-open="false">
      <header><h2>Tuning</h2><button id="tuneClose">Close</button></header>
      <div id="tuneBody"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
